# cargo-deny 設定：依存ライブラリのライセンスと取得元を検査する。
# 脆弱性の検査は CI の cargo audit で行う。

[graph]
all-features = false

[licenses]
# MIT ライセンスで配布するアプリと両立する、寛容なライセンスだけを許可する。
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  # cssparser など Tauri の依存が使用。ファイル単位のコピーレフトで、未改変のまま利用する限り MIT と両立する。
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
