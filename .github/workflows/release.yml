name: Release

# v*.*.* のタグを push したときだけ実行する。タグを作れるのはメンテナーのみ。
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release-windows:
    name: Build and draft GitHub Release (Windows)
    runs-on: windows-latest
    # GitHub の Environment「release」で、承認者や利用可能なブランチ・タグを制限する。
    environment: release
    permissions:
      contents: write # GitHub Release の下書き作成に必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Check that the tag matches the app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg_version=$(node -p "require('./package.json').version")
          # [workspace.package] の version（Cargo.toml で最初に現れる version 行）
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v${app_version}" != "$TAG" ] || [ "v${pkg_version}" != "$TAG" ] || [ "v${cargo_version}" != "$TAG" ]; then
            echo "::error::タグ ${TAG} と、tauri.conf.json（${app_version}）・package.json（${pkg_version}）・Cargo.toml（${cargo_version}）のバージョンが一致しません"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo test --workspace --locked
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about
      # ライセンス一覧の同梱は配布の条件のため、生成に失敗したらリリースを止める
      - name: Generate third-party licenses
        run: pnpm licenses:generate
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自動更新（アップデーター）を導入する場合は、更新ファイル用の署名鍵を
          # Environment「release」の Secrets に登録して参照する。Windows のコード署名
          # （SmartScreen 対策）とは別物。コード署名は docs/release.md を参照。
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Reqit ${{ github.ref_name }}
          releaseBody: |
            変更内容は [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) を参照してください。
            See CHANGELOG.md for details.

            - インストーラー：`*-setup.exe`（推奨）または `*.msi`
            - 署名はまだありません。SmartScreen の警告が出た場合は README の「インストール」を参照してください。
            - `SHA256SUMS.txt`：ダウンロードしたファイルの検証用
            - `reqit-${{ github.ref_name }}.spdx.json`：SBOM（使用しているライブラリの一覧、SPDX 形式）
            - `THIRD_PARTY_LICENSES.html`：同梱しているサードパーティのライセンス文（アプリ内の「ライセンス」からも表示できます）
          releaseDraft: true
          prerelease: false

      # SBOM はリポジトリの既定ブランチ（main）の依存関係グラフから GitHub が生成する。
      # タグは main から作る運用のため、リリース内容と一致する。
      - name: Attach SBOM and checksums to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-extra
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq .sbom > "release-extra/reqit-${TAG}.spdx.json"
          cp target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi release-extra/
          cp public/third-party-licenses.html release-extra/THIRD_PARTY_LICENSES.html
          (cd release-extra && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" "release-extra/reqit-${TAG}.spdx.json" release-extra/THIRD_PARTY_LICENSES.html release-extra/SHA256SUMS.txt --clobber
