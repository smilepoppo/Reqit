name: 機能の提案 / Feature request
description: 新しい機能や改善を提案する / Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題 / Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する内容 / Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案 / Alternatives considered
