# cargo-about 設定：配布物に含める Rust 依存ライブラリのライセンス文を集める。
# 許可するライセンスは deny.toml と同じにする。
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
# 配布するのは Windows 版のみ。ビルド時だけ使う依存と開発用の依存は配布物に含まれない。
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
